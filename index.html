<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Eastenders Turbo Fighter</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Arial Black', Impact, sans-serif;
      background-color: #000;
      user-select: none;
      touch-action: manipulation;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      z-index: 10;
    }
    .health-bar-container {
      width: 100%;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid #fff;
      height: 24px;
      border-radius: 4px;
      overflow: hidden;
    }
    .health-bar {
      height: 100%;
      width: 100%;
      transition: width 0.1s ease-out;
    }
    #p1-health { background: linear-gradient(90deg, #ff0000, #ff5555); }
    #p2-health { background: linear-gradient(90deg, #00ff00, #55ff55); float: right; }
    .player-label {
      font-size: 14px;
      text-transform: uppercase;
      text-shadow: 2px 2px #000;
      display: block;
      margin-bottom: 2px;
    }
    #p1-label { color: #ff5555; }
    #p2-label { color: #55ff55; text-align: right; }
    #timer {
      font-size: 28px;
      background: #000;
      border: 2px solid #fff;
      padding: 2px 12px;
      border-radius: 5px;
      color: #ffcc00;
      margin: 0 10px;
    }
    
    /* MOBILE TOUCH CONTROLS */
    #mobile-controls {
      position: absolute;
      bottom: 15px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 15px;
      box-sizing: border-box;
      z-index: 10;
    }
    .dpad, .action-buttons {
      display: flex;
      gap: 10px;
    }
    .touch-btn {
      width: 55px;
      height: 55px;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid #fff;
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .touch-btn:active {
      background: rgba(255, 255, 255, 0.6);
    }
    .special-btn {
      background: rgba(255, 204, 0, 0.4);
      border-color: #ffcc00;
    }

    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffcc00;
      font-size: 40px;
      text-shadow: 4px 4px #000;
      display: none;
      z-index: 20;
      text-align: center;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <div style="width: 42%;">
      <span id="p1-label" class="player-label">Phil Mitchell</span>
      <div class="health-bar-container">
        <div id="p1-health" class="health-bar"></div>
      </div>
    </div>
    <div id="timer">99</div>
    <div style="width: 42%;">
      <span id="p2-label" class="player-label">Dot Cotton</span>
      <div class="health-bar-container">
        <div id="p2-health" class="health-bar"></div>
      </div>
    </div>
  </div>

  <div id="mobile-controls">
    <div class="dpad">
      <div class="touch-btn" id="btn-left">◄</div>
      <div class="touch-btn" id="btn-right">►</div>
      <div class="touch-btn" id="btn-jump">▲</div>
      <div class="touch-btn" id="btn-block">🛡</div>
    </div>
    <div class="action-buttons">
      <div class="touch-btn" id="btn-punch">P</div>
      <div class="touch-btn" id="btn-kick">K</div>
      <div class="touch-btn special-btn" id="btn-special">S</div>
    </div>
  </div>

  <div id="game-over">
    <div id="winner-text">PHIL WINS!</div>
    <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; font-size: 18px; cursor: pointer;">REMATCH</button>
  </div>

  <script>
    // --- 1. SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x110826);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Light Setup
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffaa55, 0.8);
    dirLight.position.set(0, 10, 5);
    scene.add(dirLight);

    // Stage
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 10),
      new THREE.MeshStandardMaterial({ color: 0x333333 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const wall = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 8),
      new THREE.MeshStandardMaterial({ color: 0x8b263e })
    );
    wall.position.set(0, 4, -5);
    scene.add(wall);

    // --- 2. FIGHTERS SETUP ---
    function createFighter(color, xPos) {
      const group = new THREE.Group();

      // Body
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.6), new THREE.MeshStandardMaterial({ color }));
      body.position.y = 0.9;
      group.add(body);

      // Head
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffccaa }));
      head.position.y = 2.1;
      group.add(head);

      // Fist (Punch)
      const fist = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshStandardMaterial({ color: 0xffccaa }));
      fist.position.set(0.5, 1.2, 0);
      fist.visible = false;
      group.add(fist);

      // Foot (Kick)
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.6), new THREE.MeshStandardMaterial({ color: 0x222222 }));
      foot.position.set(0.5, 0.4, 0);
      foot.visible = false;
      group.add(foot);

      group.position.x = xPos;
      
      return {
        mesh: group,
        fist: fist,
        foot: foot,
        health: 100,
        isAttacking: false,
        isBlocking: false,
        vy: 0,
        isGrounded: true
      };
    }

    const p1 = createFighter(0xd32f2f, -3); // Phil Mitchell
    const p2 = createFighter(0x2e7d32, 3);  // Dot Cotton
    p2.mesh.scale.x = -1;

    scene.add(p1.mesh);
    scene.add(p2.mesh);

    // Projectile Pool
    const projectiles = [];

    function spawnProjectile(x, direction, color, type) {
      const geo = type === 'bottle' ? new THREE.CylinderGeometry(0.12, 0.12, 0.5) : new THREE.CylinderGeometry(0.05, 0.05, 0.4);
      const mat = new THREE.MeshStandardMaterial({ color, transparent: true, opacity: type === 'bottle' ? 0.75 : 1.0 });
      const proj = new THREE.Mesh(geo, mat);
      proj.rotation.z = Math.PI / 2;
      proj.position.set(x, p1.mesh.position.y + 1.5, 0);
      scene.add(proj);

      projectiles.push({
        mesh: proj,
        dir: direction,
        owner: direction > 0 ? p1 : p2,
        target: direction > 0 ? p2 : p1,
        targetEl: direction > 0 ? 'p2-health' : 'p1-health'
      });
    }

    // --- 3. INPUT & CONTROLS ---
    const keys = {};
    let gameOver = false;

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (gameOver) return;

      // Jump (W or ArrowUp)
      if ((e.code === 'KeyW' || e.code === 'ArrowUp') && p1.isGrounded) {
        p1.vy = 0.22;
        p1.isGrounded = false;
      }

      // Punch (J or Space)
      if (e.code === 'KeyJ' || e.code === 'Space') performPunch(p1, p2, 'p2-health');
      // Kick (K)
      if (e.code === 'KeyK') performKick(p1, p2, 'p2-health');
      // Special (L) - Bottle Throw
      if (e.code === 'KeyL') performSpecial(p1, 1, 0x55aa77, 'bottle');
    });

    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    // Mobile Touch Event Bindings
    const bindTouch = (id, startFn, endFn) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('touchstart', (e) => { e.preventDefault(); startFn(); });
      el.addEventListener('touchend', (e) => { e.preventDefault(); if (endFn) endFn(); });
    };

    bindTouch('btn-left', () => keys['KeyA'] = true, () => keys['KeyA'] = false);
    bindTouch('btn-right', () => keys['KeyD'] = true, () => keys['KeyD'] = false);
    bindTouch('btn-jump', () => {
      if (p1.isGrounded) {
        p1.vy = 0.22;
        p1.isGrounded = false;
      }
    });
    bindTouch('btn-block', () => keys['KeyS'] = true, () => keys['KeyS'] = false);
    bindTouch('btn-punch', () => performPunch(p1, p2, 'p2-health'));
    bindTouch('btn-kick', () => performKick(p1, p2, 'p2-health'));
    bindTouch('btn-special', () => performSpecial(p1, 1, 0x55aa77, 'bottle'));

    // --- 4. COMBAT ACTIONS ---
    function performPunch(attacker, defender, targetHpEl) {
      if (attacker.isAttacking || gameOver) return;
      attacker.isAttacking = true;
      attacker.fist.visible = true;

      let f = 0;
      const interval = setInterval(() => {
        f++;
        attacker.fist.position.x = 0.5 + Math.sin((f / 8) * Math.PI) * 0.5;

        if (f === 4 && Math.abs(attacker.mesh.position.x - defender.mesh.position.x) < 1.6) {
          applyDamage(defender, targetHpEl, 10);
        }

        if (f >= 8) {
          clearInterval(interval);
          attacker.fist.visible = false;
          attacker.fist.position.x = 0.5;
          attacker.isAttacking = false;
        }
      }, 20);
    }

    function performKick(attacker, defender, targetHpEl) {
      if (attacker.isAttacking || gameOver) return;
      attacker.isAttacking = true;
      attacker.foot.visible = true;

      let f = 0;
      const interval = setInterval(() => {
        f++;
        attacker.foot.position.x = 0.5 + Math.sin((f / 10) * Math.PI) * 0.7;

        if (f === 5 && Math.abs(attacker.mesh.position.x - defender.mesh.position.x) < 1.8) {
          applyDamage(defender, targetHpEl, 15);
        }

        if (f >= 10) {
          clearInterval(interval);
          attacker.foot.visible = false;
          attacker.foot.position.x = 0.5;
          attacker.isAttacking = false;
        }
      }, 20);
    }

    function performSpecial(attacker, direction, color, type) {
      if (attacker.isAttacking || gameOver) return;
      attacker.isAttacking = true;
      
      spawnProjectile(attacker.mesh.position.x + (direction * 0.8), direction, color, type);

      setTimeout(() => { attacker.isAttacking = false; }, 400);
    }

    function applyDamage(target, hpElementId, amount) {
      const finalAmount = target.isBlocking ? amount * 0.2 : amount;
      target.health = Math.max(0, target.health - finalAmount);
      document.getElementById(hpElementId).style.width = target.health + '%';
      target.mesh.position.x += (target === p1 ? -0.2 : 0.2);

      if (target.health <= 0) {
        endGame(target === p2 ? 'PHIL MITCHELL WINS!' : 'DOT COTTON WINS!');
      }
    }

    // --- 5. CPU AI FOR DOT COTTON ---
    let aiCooldown = false;
    function updateAI() {
      if (gameOver || aiCooldown) return;

      const dist = p2.mesh.position.x - p1.mesh.position.x;

      // Move toward or away from P1
      if (dist > 3) {
        p2.mesh.position.x -= 0.04;
      } else if (dist < 1.2) {
        p2.mesh.position.x += 0.04;
      }

      // Random Attack Decision
      if (Math.random() < 0.03) {
        aiCooldown = true;
        const rand = Math.random();

        if (dist < 1.8 && rand < 0.4) {
          performPunch(p2, p1, 'p1-health');
        } else if (dist < 2.0 && rand < 0.7) {
          performKick(p2, p1, 'p1-health');
        } else {
          performSpecial(p2, -1, 0xffffff, 'projectile');
        }

        setTimeout(() => { aiCooldown = false; }, 800);
      }
    }

    function endGame(msg) {
      gameOver = true;
      document.getElementById('winner-text').innerText = msg;
      document.getElementById('game-over').style.display = 'block';
    }

    // Timer
    let timeLeft = 99;
    setInterval(() => {
      if (gameOver) return;
      timeLeft--;
      document.getElementById('timer').innerText = timeLeft;
      if (timeLeft <= 0) {
        endGame(p1.health > p2.health ? 'PHIL WINS ON TIME!' : 'DOT WINS ON TIME!');
      }
    }, 1000);

    // --- 6. GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      if (!gameOver) {
        // Player 1 Block Check (S or ArrowDown)
        p1.isBlocking = (keys['KeyS'] || keys['ArrowDown']);

        // Player 1 Horizontal Movement (Reduced while blocking)
        const moveSpeed = p1.isBlocking ? 0.03 : 0.08;
        if ((keys['KeyA'] || keys['ArrowLeft']) && p1.mesh.position.x > -8) {
          p1.mesh.position.x -= moveSpeed;
        }
        if ((keys['KeyD'] || keys['ArrowRight']) && p1.mesh.position.x < p2.mesh.position.x - 1.1) {
          p1.mesh.position.x += moveSpeed;
        }

        // Apply Jump Gravity Physics to P1
        if (!p1.isGrounded) {
          p1.mesh.position.y += p1.vy;
          p1.vy -= 0.01; // Gravity constant

          if (p1.mesh.position.y <= 0) {
            p1.mesh.position.y = 0;
            p1.vy = 0;
            p1.isGrounded = true;
          }
        }

        // Run CPU AI
        updateAI();

        // Update Projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];
          p.mesh.position.x += p.dir * 0.15;
          p.mesh.rotation.z += 0.2; // Spin projectile in air

          // Check Hit
          if (Math.abs(p.mesh.position.x - p.target.mesh.position.x) < 0.8 &&
              Math.abs(p.mesh.position.y - (p.target.mesh.position.y + 1.0)) < 1.2) {
            applyDamage(p.target, p.targetEl, 20);
            scene.remove(p.mesh);
            projectiles.splice(i, 1);
            continue;
          }

          // Offscreen Cleanup
          if (Math.abs(p.mesh.position.x) > 10) {
            scene.remove(p.mesh);
            projectiles.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
