<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eastenders Turbo Fighter</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Arial Black', Impact, sans-serif;
      background-color: #000;
      user-select: none;
    }
    #ui {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      z-index: 10;
    }
    .health-bar-container {
      width: 40%;
      background: rgba(255, 255, 255, 0.2);
      border: 3px solid #fff;
      height: 30px;
      border-radius: 5px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .health-bar {
      height: 100%;
      width: 100%;
      transition: width 0.2s ease-out;
    }
    #p1-health { background: linear-gradient(90deg, #ff0000, #ff5555); }
    #p2-health { background: linear-gradient(90deg, #00ff00, #55ff55); float: right; }
    .player-label {
      position: absolute;
      top: -25px;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 2px 2px #000;
    }
    #p1-label { left: 0; color: #ff5555; }
    #p2-label { right: 0; color: #55ff55; }
    #timer {
      font-size: 32px;
      background: #000;
      border: 2px solid #fff;
      padding: 5px 15px;
      border-radius: 5px;
      color: #ffcc00;
    }
    #controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      z-index: 10;
      border: 1px solid #444;
    }
    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffcc00;
      font-size: 48px;
      text-shadow: 4px 4px #000;
      display: none;
      z-index: 20;
      text-align: center;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <div style="position: relative; width: 40%;">
      <span id="p1-label" class="player-label">Phil Mitchell</span>
      <div class="health-bar-container">
        <div id="p1-health" class="health-bar"></div>
      </div>
    </div>
    <div id="timer">99</div>
    <div style="position: relative; width: 40%;">
      <span id="p2-label" class="player-label">Dot Cotton</span>
      <div class="health-bar-container">
        <div id="p2-health" class="health-bar"></div>
      </div>
    </div>
  </div>

  <div id="controls-hint">
    <b>Controls:</b> Move: <code>A</code> / <code>D</code> | Attack: <code>Spacebar</code>
  </div>

  <div id="game-over">
    <div id="winner-text">PHIL WINS!</div>
    <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; font-size: 18px; cursor: pointer;">REMATCH</button>
  </div>

  <script>
    // --- 1. SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x110826);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // --- 2. LIGHTING & STAGE (Queen Vic / Albert Square Concept) ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffaa55, 0.8);
    dirLight.position.set(0, 10, 5);
    scene.add(dirLight);

    // Arena Floor
    const floorGeo = new THREE.PlaneGeometry(20, 10);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    // Background Wall
    const wallGeo = new THREE.PlaneGeometry(20, 8);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x8b263e }); // Queen Vic Pub Red
    const wall = new THREE.Mesh(wallGeo, wallMat);
    wall.position.set(0, 4, -5);
    scene.add(wall);

    // --- 3. FIGHTERS ---
    function createFighter(color, xPos) {
      const group = new THREE.Group();

      // Body Mesh
      const bodyGeo = new THREE.BoxGeometry(0.8, 1.8, 0.6);
      const bodyMat = new THREE.MeshStandardMaterial({ color });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.9;
      group.add(body);

      // Head Mesh
      const headGeo = new THREE.SphereGeometry(0.35, 16, 16);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 2.1;
      group.add(head);

      // Fist (Attack Mesh)
      const fistGeo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
      const fistMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
      const fist = new THREE.Mesh(fistGeo, fistMat);
      fist.position.set(0.5, 1.2, 0);
      fist.visible = false;
      group.add(fist);

      group.position.x = xPos;
      
      return {
        mesh: group,
        fist: fist,
        health: 100,
        isAttacking: false,
        velocity: 0
      };
    }

    const p1 = createFighter(0xd32f2f, -3); // Phil Mitchell (Red)
    const p2 = createFighter(0x2e7d32, 3);  // Dot Cotton (Green)
    
    // Turn Dot Cotton to face left
    p2.mesh.scale.x = -1;

    scene.add(p1.mesh);
    scene.add(p2.mesh);

    // --- 4. GAME STATE & CONTROLS ---
    const keys = {};
    let gameOver = false;

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' && !p1.isAttacking && !gameOver) {
        performAttack();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    function performAttack() {
      p1.isAttacking = true;
      p1.fist.visible = true;

      // Animate punch forward
      let punchFrame = 0;
      const punchInterval = setInterval(() => {
        punchFrame++;
        p1.fist.position.x = 0.5 + Math.sin((punchFrame / 10) * Math.PI) * 0.6;

        // Hit Detection
        const distance = Math.abs(p1.mesh.position.x - p2.mesh.position.x);
        if (distance < 1.6 && punchFrame === 5 && !gameOver) {
          p2.health = Math.max(0, p2.health - 15);
          document.getElementById('p2-health').style.width = p2.health + '%';
          
          // Hit recoil
          p2.mesh.position.x += 0.3;

          if (p2.health <= 0) {
            endGame('PHIL MITCHELL WINS!');
          }
        }

        if (punchFrame >= 10) {
          clearInterval(punchInterval);
          p1.fist.visible = false;
          p1.fist.position.x = 0.5;
          p1.isAttacking = false;
        }
      }, 20);
    }

    function endGame(message) {
      gameOver = true;
      document.getElementById('winner-text').innerText = message;
      document.getElementById('game-over').style.display = 'block';
    }

    // Timer countdown
    let timeLeft = 99;
    const timerInterval = setInterval(() => {
      if (gameOver) {
        clearInterval(timerInterval);
        return;
      }
      timeLeft--;
      document.getElementById('timer').innerText = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        endGame(p1.health > p2.health ? 'PHIL WINS ON TIME!' : 'DOT WINS ON TIME!');
      }
    }, 1000);

    // --- 5. GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      if (!gameOver) {
        // Player 1 Movement
        if (keys['KeyA'] && p1.mesh.position.x > -8) {
          p1.mesh.position.x -= 0.08;
        }
        if (keys['KeyD'] && p1.mesh.position.x < p2.mesh.position.x - 1.1) {
          p1.mesh.position.x += 0.08;
        }

        // Simple CPU AI for Player 2 (Dot Cotton)
        const distance = p2.mesh.position.x - p1.mesh.position.x;
        if (distance > 2) {
          p2.mesh.position.x -= 0.02; // Walk towards P1
        }
      }

      renderer.render(scene, camera);
    }

    animate();

    // Responsive window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
